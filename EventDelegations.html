<!DOCTYPE html>
<html>
<body>

<h2>Event Delegation Example</h2>

<div id="parent">
    <button>Apple</button>
    <button>Orange</button>
    <button>Mango</button>
</div>

<script>
 let a=document.getElementById("parent")
.addEventListener("click", function(event) {

    if (event.target.tagName === "BUTTON") {
        alert("You clicked " + event.target.innerText);
    }

});
</script>

</body>
</html>
